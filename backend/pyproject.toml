[project]
name = "blink-backend"
version = "1.4.2"
description = "Blink AI Security Platform — API and background worker"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.19.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "pwdlib[argon2]>=0.3.0",
    "arq>=0.28.0",
    # redis-py is capped <6 by arq; the Redis *server* still runs 8.x.
    "redis>=5.2,<6",
    "cryptography>=49.0.0",
    "structlog>=26.1.0",
    "blinkpy>=0.25.9",
    "httpx>=0.28.1",
    "openai>=3.0.0",
    "anthropic>=0.120.2",
    "ollama>=0.6.2",
    "pillow>=12.3.0",
    "numpy>=2.5.1",
    # Storage archive integrations (app/integrations/) - S3 (boto3), Google
    # Drive (google-auth-oauthlib + google-api-python-client), OneDrive's
    # OAuth token lifecycle (msal; file operations go straight to Microsoft
    # Graph over httpx, already a dependency - Microsoft has no separate
    # "OneDrive files" SDK). All pure Python, no native extensions.
    "boto3>=1.43.65",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.198.0",
    "msal>=1.37.0",
    # GPU build on x86_64 (the only arch it ships wheels for at all) so an
    # NVIDIA GPU is actually usable for biometrics without a system-wide
    # CUDA Toolkit install - [cuda,cudnn] extras pull the matching NVIDIA
    # runtime libraries as plain pip wheels; app.biometrics.recognition
    # calls onnxruntime.preload_dlls() so onnxruntime's CUDA execution
    # provider can actually find them. Plain CPU build everywhere else
    # (arm64/Raspberry Pi-class hosts) - resolve_providers() in
    # app.biometrics.recognition already falls back to CPU correctly
    # whenever CUDA isn't reported available, so no other branching is
    # needed for this to keep working there.
    "onnxruntime-gpu[cuda,cudnn]>=1.28.0; platform_machine == 'x86_64'",
    "onnxruntime>=1.28.0; platform_machine != 'x86_64'",
    # Pulls in full opencv-python (not -headless): its declared dependency,
    # and uv/pip have no package-substitution mechanism to swap it for the
    # smaller headless build without installing both side by side into the
    # same cv2/ namespace, which is worse. Full opencv-python's compiled cv2
    # extension dynamically links libGL/libGTK at import time — present on
    # Debian (dev image, and most host/CI environments) but absent from the
    # minimal Wolfi prod runtime, where it crashes `import cv2` outright. The
    # prod Dockerfile force-reinstalls opencv-python-headless (same upstream
    # version, GL-free) over it after `uv sync` to fix this; see there.
    "insightface>=1.0.1",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.16.1",
    "pyright>=1.1.411",
    "bandit>=1.9.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "A", "ARG", "ASYNC", "B", "C4", "DTZ", "E", "ERA", "F", "G", "I",
    "ISC", "LOG", "N", "PERF", "PIE", "PTH", "RET", "RUF", "S", "SIM",
    "T20", "TID", "UP", "W",
]
[tool.ruff.lint.isort]
# The repo's alembic/ scripts directory must not make ruff treat the installed
# alembic package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# ASYNC240: blocking a test's own event loop briefly for a filesystem
# assertion is fine — it's not production code serving concurrent requests.
"tests/**" = ["S101", "S105", "S106", "ARG001", "ARG002", "ASYNC240"]
# Protocol implementations and framework hooks keep their signatures even
# when an implementation ignores an argument.
"app/blink/service.py" = ["ARG002"]
# A CLI entry point's job is talking to the terminal — print is correct here,
# not a debug leftover.
"app/cli.py" = ["T201"]
"app/users/manager.py" = ["ARG002"]
"app/worker/main.py" = ["ARG001"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["app", "tests"]
exclude = ["**/__pycache__", ".venv", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=app --cov-report=term-missing"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\":",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
