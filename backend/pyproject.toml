[project]
name = "blink-backend"
version = "0.1.0"
description = "Blink AI Security Platform — API and background worker"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "pwdlib[argon2]>=0.3.0",
    "arq>=0.28.0",
    # redis-py is capped <6 by arq; the Redis *server* still runs 8.x.
    "redis>=5.2,<6",
    "cryptography>=49.0.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.16.0",
    "pyright>=1.1.411",
    "bandit>=1.9.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "A", "ARG", "ASYNC", "B", "C4", "DTZ", "E", "ERA", "F", "G", "I",
    "ISC", "LOG", "N", "PERF", "PIE", "PTH", "RET", "RUF", "S", "SIM",
    "T20", "TID", "UP", "W",
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001", "ARG002"]
# Protocol implementations and framework hooks keep their signatures even
# when an implementation ignores an argument.
"app/blink/service.py" = ["ARG002"]
"app/users/manager.py" = ["ARG002"]
"app/worker/main.py" = ["ARG001"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["app", "tests"]
exclude = ["**/__pycache__", ".venv", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=app --cov-report=term-missing"
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\":",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
