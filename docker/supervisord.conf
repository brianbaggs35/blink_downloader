; Runs the consolidated prod image's 3 sibling processes (nginx, API, worker)
; under one container. All logs go to stdout/stderr (maxbytes=0 disables
; supervisord's log rotation, required when the "file" is actually a pipe to
; the container's own console) so `docker compose logs` still shows
; everything. Every runtime path (log/pid files) lives under /tmp, which
; docker-compose.yml mounts as tmpfs - the rest of the image stays read-only.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips *
directory=/app
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/app/.venv/bin/arq app.worker.main.WorkerSettings
directory=/app
priority=10
autorestart=true
; arq finishes an in-flight job (an AI provider call, a biometrics model
; download, ...) before exiting on SIGTERM rather than abandoning it
; mid-request - matches docker-compose.yml's app service stop_grace_period,
; with headroom for supervisord/tini's own shutdown steps.
stopsignal=TERM
stopwaitsecs=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
