# Test environment.
#   --profile unit — containerized backend test run (used by CI); also what
#                    `make test-db`/`make test-backend-fast` start directly
#                    by name for a local (non-containerized) pytest run
#   --profile e2e  — production-like stack seeded with fixtures + Playwright
name: blink-test

services:
  postgres-test:
    profiles: [unit]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: blink
      POSTGRES_DB: blink_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink -d blink_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis-test:
    profiles: [unit]
    image: redis:8-alpine
    ports:
      - "127.0.0.1:63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend-tests:
    profiles: [unit]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    command: ["uv", "run", "pytest"]
    working_dir: /app
    volumes:
      - ./backend:/app
      - test-venv:/opt/venv
      - test-uv-cache:/root/.cache/uv
    environment:
      BLINK_ENVIRONMENT: test
      BLINK_DATABASE_URL: postgresql+asyncpg://blink:blink@postgres-test:5432/blink_test
      BLINK_REDIS_URL: redis://redis-test:6379/0
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  # --- e2e stack: mirrors production service names so nginx.conf resolves ---

  postgres:
    profiles: [e2e]
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: blink
      POSTGRES_DB: blink
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink -d blink"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    profiles: [e2e]
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    profiles: [e2e]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: prod
    command: ["/app/.venv/bin/python", "-m", "app.testing.e2e_entry"]
    environment:
      BLINK_ENVIRONMENT: test
      BLINK_DATABASE_URL: postgresql+asyncpg://blink:blink@postgres:5432/blink
      BLINK_REDIS_URL: redis://redis:6379/0
      BLINK_SECRET_KEY: e2e-secret-key-not-for-production
      BLINK_ENCRYPTION_KEY: iRZbYNDbXbGGoHy4JV2XChcPYDbdCTC9YXf29CQzB1I=
      # Camera preview/record requests are served directly by this container
      # (app/api/cameras.py), not the worker - see the worker service's own
      # copy of this var, and Settings.disable_blink_network_calls, for why.
      BLINK_DISABLE_BLINK_NETWORK_CALLS: "true"
      # Mounts POST /api/testing/reset (app/api/testing.py) - lets Playwright
      # reset to a known baseline before every test. Never set in prod's own
      # docker-compose.yml, so the route doesn't exist there at all.
      BLINK_ENABLE_TEST_RESET_ENDPOINT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  frontend:
    profiles: [e2e]
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: prod
      args:
        # Set by `make e2e-coverage` only - every other target (including
        # plain `make e2e`) leaves this at the Dockerfile's own default.
        VITE_COVERAGE: ${VITE_COVERAGE:-false}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

  worker:
    profiles: [e2e]
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: prod
    command: ["/app/.venv/bin/arq", "app.worker.main.WorkerSettings"]
    environment:
      BLINK_ENVIRONMENT: test
      BLINK_DATABASE_URL: postgresql+asyncpg://blink:blink@postgres:5432/blink
      BLINK_REDIS_URL: redis://redis:6379/0
      BLINK_SECRET_KEY: e2e-secret-key-not-for-production
      BLINK_ENCRYPTION_KEY: iRZbYNDbXbGGoHy4JV2XChcPYDbdCTC9YXf29CQzB1I=
      # The seeded Blink account's credentials are bogus (see app/testing/seed.py)
      # - a real sync can only ever fail against Blink's actual cloud API,
      # flipping the seeded "healthy" status to an auth error at some point
      # during the run. Fixtures are inserted directly by the seed script,
      # so no real sync is needed here at all - see the backend service's
      # own copy of this var, and Settings.disable_blink_network_calls.
      BLINK_DISABLE_BLINK_NETWORK_CALLS: "true"
    depends_on:
      redis:
        condition: service_healthy

  playwright:
    profiles: [e2e]
    # Keep in lockstep with @playwright/test in e2e/package.json — the stable
    # image tag can lag the npm release by a few weeks.
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    working_dir: /e2e
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    volumes:
      - ./e2e:/e2e
    environment:
      E2E_BASE_URL: https://frontend:8443
      CI: "true"
      # Set (to /e2e/.nyc_output) only by `make e2e-coverage` - see
      # fixtures/index.ts. Empty/unset everywhere else, so a plain
      # `make e2e`/`make e2e-test` run doesn't try to collect anything.
      COVERAGE_DIR: ${COVERAGE_DIR:-}
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  test-venv:
  test-uv-cache:
