# Dedicated stack for onboarding e2e coverage (make e2e-onboarding-*).
#
# /setup is a one-shot gate: reachable only while the users table has zero
# rows (app.api.setup.status, frontend/src/router/guards.ts). The plain e2e
# stack (docker-compose.test.yml's `e2e` profile) seeds an admin at boot
# specifically so its whole suite can rely on already-signed-in state - which
# means /setup is permanently unreachable there. This file boots the same
# images with BLINK_SKIP_SEED=true instead, so the database stays genuinely
# empty and the wizard can actually be driven end-to-end. A separate
# top-level file (not another docker-compose.test.yml profile) because
# nginx.conf hardcodes the upstream hostname "backend" - a same-file second
# backend service would need a different name and break that resolution.
name: blink-onboarding

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: blink
      POSTGRES_DB: blink
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink -d blink"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: prod
    command: ["/app/.venv/bin/python", "-m", "app.testing.e2e_entry"]
    environment:
      BLINK_ENVIRONMENT: test
      BLINK_DATABASE_URL: postgresql+asyncpg://blink:blink@postgres:5432/blink
      BLINK_REDIS_URL: redis://redis:6379/0
      BLINK_SECRET_KEY: e2e-secret-key-not-for-production
      BLINK_ENCRYPTION_KEY: iRZbYNDbXbGGoHy4JV2XChcPYDbdCTC9YXf29CQzB1I=
      # The whole point of this stack - see Settings.skip_seed. Never set in
      # docker-compose.test.yml's own e2e profile, whose suite depends on
      # the seeded admin/demo data already existing at boot.
      BLINK_SKIP_SEED: "true"
      # Belt-and-suspenders: nothing in this stack ever creates a real Blink
      # account (the wizard's 2FA step is exercised via Playwright's
      # page.route() interception, never a real blinkpy call), but this
      # matches the same safety net docker-compose.test.yml's e2e profile
      # sets for itself. See Settings.disable_blink_network_calls.
      BLINK_DISABLE_BLINK_NETWORK_CALLS: "true"
      # Mounts POST /api/testing/reset (app/api/testing.py). Not exercised
      # by the wizard flow itself (a one-shot gate can't be "reset" back
      # open without wiping the very user it just created), but available
      # for any later spec here that wants to reset domain data without
      # re-running the wizard - see Settings.enable_test_reset_endpoint.
      BLINK_ENABLE_TEST_RESET_ENDPOINT: "true"
      # onboarding.setup.ts deliberately submits the Account step more than
      # once (a too-short password, a mismatched confirm, then valid values)
      # and exercises Blink's link/verify endpoints too - all share the
      # same per-IP budget a real attacker would trip. See
      # Settings.disable_rate_limits.
      BLINK_DISABLE_RATE_LIMITS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: prod
    ports:
      - "127.0.0.1:8444:8443"
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: prod
    command: ["/app/.venv/bin/arq", "app.worker.main.WorkerSettings"]
    environment:
      BLINK_ENVIRONMENT: test
      BLINK_DATABASE_URL: postgresql+asyncpg://blink:blink@postgres:5432/blink
      BLINK_REDIS_URL: redis://redis:6379/0
      BLINK_SECRET_KEY: e2e-secret-key-not-for-production
      BLINK_ENCRYPTION_KEY: iRZbYNDbXbGGoHy4JV2XChcPYDbdCTC9YXf29CQzB1I=
      # This service runs arq directly (not app.testing.e2e_entry), so it
      # never seeds anything itself either way - see the backend service's
      # own copy of this var for the one that actually matters.
      BLINK_DISABLE_BLINK_NETWORK_CALLS: "true"
    depends_on:
      redis:
        condition: service_healthy

  playwright:
    # Keep in lockstep with @playwright/test in e2e/package.json — the stable
    # image tag can lag the npm release by a few weeks.
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    working_dir: /e2e
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test --config=onboarding.config.ts"]
    volumes:
      - ./e2e:/e2e
    environment:
      ONBOARDING_BASE_URL: https://frontend:8443
      CI: "true"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
