# Production stack. Entry point: `make prod` (needs .env — see `make secrets`).
name: blink

services:
  # Frontend (nginx) + backend API + worker, one image/container - see
  # docker/app.Dockerfile. Dev and e2e still run these as separate
  # containers (docker-compose.dev.yml / docker-compose.test.yml).
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: prod
      secrets:
        - primevue_license
    ports:
      - "${BLINK_HTTP_PORT:-80}:8080"
      - "${BLINK_HTTPS_PORT:-443}:8443"
    environment:
      BLINK_ENVIRONMENT: production
      BLINK_DATABASE_URL: postgresql+asyncpg://blink:${POSTGRES_PASSWORD}@postgres:5432/blink
      BLINK_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BLINK_SECRET_KEY: ${BLINK_SECRET_KEY}
      BLINK_ENCRYPTION_KEY: ${BLINK_ENCRYPTION_KEY}
      BLINK_STORAGE_DIR: /data/clips
      BLINK_BIOMETRICS_MODEL_CACHE_DIR: /data/insightface
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
      - clips:/data/clips
      - insightface:/data/insightface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # arq finishes an in-flight job (an AI provider call, a biometrics model
    # download, ...) before exiting on SIGTERM rather than abandoning it
    # mid-request; Compose's 10s default would SIGKILL well before that.
    stop_grace_period: 45s

  migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: prod
      secrets:
        - primevue_license
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment:
      BLINK_ENVIRONMENT: production
      BLINK_DATABASE_URL: postgresql+asyncpg://blink:${POSTGRES_PASSWORD}@postgres:5432/blink
      BLINK_SECRET_KEY: ${BLINK_SECRET_KEY}
      BLINK_ENCRYPTION_KEY: ${BLINK_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: blink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: blink
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blink -d blink"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  primevue_license:
    environment: VITE_PRIMEVUE_LICENSE_KEY

volumes:
  pgdata:
  redisdata:
  clips:
  insightface:
