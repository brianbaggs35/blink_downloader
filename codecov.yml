coverage:
  status:
    project:
      default:
        # "auto" (compare against the base commit) is fine going forward,
        # but the very first PR to upload the e2e flag will always read as
        # a false regression against a pre-e2e-blend master baseline - once
        # this merges, master's own baseline includes e2e and "auto"
        # self-corrects.
        target: auto
        threshold: 1%
    patch:
      default:
        # Vue's SFC compiler hoists fully-static template attributes (e.g.
        # a multi-line <label class="..." for="..."> tag written one
        # attribute per line, this repo's standard style) out of the
        # render function entirely. v8/nyc's coverage instrumentation still
        # attributes a stray DA: record to one of those attribute-only
        # lines (a bare `>`, `class="..."`, or `for="..."`), reporting it
        # "missed" even though the element's real dynamic content (a
        # v-model, a v-if) is fully exercised in the very same block -
        # confirmed empirically: every line Codecov has ever flagged on
        # this repo matches this exact pattern. A few points of slack
        # absorbs that noise without hiding a real regression - a
        # genuinely untested new function or branch is never this small a
        # fraction of a patch.
        target: 80%
        threshold: 3%
  precision: 2
  round: down

comment:
  layout: "header, diff, flags, components"
  require_changes: true
