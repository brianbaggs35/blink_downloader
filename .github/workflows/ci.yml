name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend · ruff + pyright + bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run bandit -c pyproject.toml -r app

  backend-test:
    name: Backend · pytest (100% coverage gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: blink
          POSTGRES_PASSWORD: blink
          POSTGRES_DB: blink_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U blink -d blink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BLINK_DATABASE_URL: postgresql+asyncpg://blink:blink@localhost:55432/blink_test
      BLINK_REDIS_URL: redis://localhost:63790/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Migration drift gate
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest

  api-contract:
    name: API · generated client in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Regenerate schema and compare
        run: |
          make api-types
          git diff --exit-code frontend/src/api/schema.d.ts

  frontend:
    name: Frontend · eslint + vue-tsc + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  docker-lint:
    name: Docker · hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/backend.Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/frontend.Dockerfile
          config: .hadolint.yaml

  docker-build:
    name: Docker · prod images build + Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          target: prod
          push: false
          load: true
          pull: true
          tags: blink-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Smoke-test the backend image actually boots
        # Trivy scans for known CVEs but never runs the image - a missing
        # shared library (e.g. opencv-python's libGL, absent from the
        # minimal Wolfi runtime) would build and scan clean while still
        # crashing on the very first import. This needs no DB/Redis: it
        # only exercises module import, not a live request.
        run: docker run --rm blink-backend:ci /app/.venv/bin/python -c "import app.main"
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          target: prod
          push: false
          load: true
          pull: true
          tags: blink-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Scan backend image (Trivy, readable)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blink-backend:ci
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.72.0
      - name: Scan frontend image (Trivy, readable)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blink-frontend:ci
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.72.0
      - name: Scan backend image (Trivy, SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blink-backend:ci
          format: sarif
          output: trivy-backend.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          version: v0.72.0
      - name: Scan frontend image (Trivy, SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blink-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          version: v0.72.0
      - name: Upload backend Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      - name: Upload frontend Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  prod-smoke:
    name: Docker · production stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate a self-signed TLS cert
        run: make certs
      - name: Write throwaway secrets for this ephemeral stack
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          POSTGRES_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          REDIS_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          BLINK_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          BLINK_ENCRYPTION_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          EOF
      - name: Boot the production stack
        run: docker compose -f docker-compose.yml up -d --build --wait
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the smoke spec against the live production stack
        working-directory: e2e
        run: npm run smoke
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: e2e/smoke-report
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  e2e-lint:
    name: E2E · eslint + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    name: E2E · Playwright against seeded stack
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Run e2e suite against an instrumented frontend, with coverage
        run: make e2e-coverage
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Upload e2e frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-report
          path: e2e/coverage
          retention-days: 7
