name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend · ruff + pyright + bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run bandit -c pyproject.toml -r app

  backend-test:
    name: Backend · pytest (100% coverage gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: blink
          POSTGRES_PASSWORD: blink
          POSTGRES_DB: blink_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U blink -d blink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 63790:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BLINK_DATABASE_URL: postgresql+asyncpg://blink:blink@localhost:55432/blink_test
      BLINK_REDIS_URL: redis://localhost:63790/0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Migration drift gate
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest --cov-report=xml
      - name: Upload backend coverage report for SonarQube
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  api-contract:
    name: API · generated client in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Regenerate schema and compare
        run: |
          make api-types
          git diff --exit-code frontend/src/api/schema.d.ts

  frontend:
    name: Frontend · eslint + vue-tsc + vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Upload frontend coverage report for SonarQube
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/cobertura-coverage.xml
          flags: frontend
          fail_ci_if_error: false

  docker-lint:
    name: Docker · hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/backend.Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/frontend.Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/app.Dockerfile
          config: .hadolint.yaml

  docker-build:
    name: Docker · prod images build + Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend.Dockerfile
          target: prod
          push: false
          load: true
          pull: true
          tags: blink-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Smoke-test the backend image actually boots
        # Trivy scans for known CVEs but never runs the image - a missing
        # shared library (e.g. opencv-python's libGL, absent from the
        # minimal Wolfi runtime) would build and scan clean while still
        # crashing on the very first import. This needs no DB/Redis: it
        # only exercises module import, not a live request.
        run: docker run --rm blink-backend:ci /app/.venv/bin/python -c "import app.main"
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend.Dockerfile
          target: prod
          push: false
          load: true
          pull: true
          tags: blink-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build consolidated app image (what actually ships)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          target: prod
          push: false
          load: true
          pull: true
          tags: blink-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Smoke-test the app image actually boots
        run: docker run --rm blink-app:ci /app/.venv/bin/python -c "import app.main"
      - name: Scan app image (Trivy, readable)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blink-app:ci
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.73.0
      - name: Scan app image (Trivy, SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blink-app:ci
          format: sarif
          output: trivy-app.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          version: v0.73.0
      - name: Upload app Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: trivy-app.sarif
          category: trivy-app
      - name: Scan backend image (Trivy, readable)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blink-backend:ci
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.73.0
      - name: Scan frontend image (Trivy, readable)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blink-frontend:ci
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.73.0
      - name: Scan backend image (Trivy, SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blink-backend:ci
          format: sarif
          output: trivy-backend.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          version: v0.73.0
      - name: Scan frontend image (Trivy, SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blink-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          version: v0.73.0
      - name: Upload backend Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      - name: Upload frontend Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

  docker-multiarch-smoke:
    name: Docker · multi-arch smoke test (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build app image (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          target: prod
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          pull: true
          tags: blink-app:smoke-${{ matrix.arch }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
      - name: Smoke-test the app image actually boots (${{ matrix.platform }})
        # Same import-only check as docker-build's native (amd64) smoke
        # test, just under QEMU emulation for arm64 - this is the image
        # images.yml actually publishes for both architectures, and the
        # only thing that legitimately differs by arch (pyproject.toml's
        # platform_machine marker: onnxruntime-gpu on amd64, plain
        # onnxruntime elsewhere) is resolved fresh in each of this job's
        # own per-platform builds, not reused from docker-build's amd64
        # native one - a missing arm64 wheel would surface right here.
        run: docker run --rm --platform ${{ matrix.platform }} blink-app:smoke-${{ matrix.arch }} /app/.venv/bin/python -c "import app.main"
      - name: Generate a self-signed TLS cert
        run: make certs
      - name: Start a throwaway Redis + the app image as real running containers (${{ matrix.platform }})
        # Unlike the import-only check above, this runs the image's real
        # entrypoint (supervisord: nginx + uvicorn + arq worker) to confirm
        # all three come up and stay up together. A reachable Redis is a
        # hard requirement even just to boot - arq's create_pool() pings it
        # during FastAPI's own startup lifespan, so the API process
        # crash-loops without one (confirmed empirically). Postgres has no
        # such requirement (SQLAlchemy's engine connects lazily), so
        # /health reporting "degraded" for the database component below is
        # expected and fine - a real Postgres+migrations is prod-smoke's
        # job (amd64-only). A dedicated bridge network is required for
        # container-name DNS between the two (confirmed empirically that
        # --network host does not reach the host's published ports at all
        # under a VM-backed Docker engine, e.g. Docker Desktop).
        run: |
          docker network create smoke-net-${{ matrix.arch }}
          docker run -d --name smoke-redis-${{ matrix.arch }} --network smoke-net-${{ matrix.arch }} redis:8-alpine
          docker run -d --name smoke-${{ matrix.arch }} --platform ${{ matrix.platform }} \
            --network smoke-net-${{ matrix.arch }} \
            -e BLINK_REDIS_URL=redis://smoke-redis-${{ matrix.arch }}:6379/0 \
            -p 8443:8443 \
            -v "${{ github.workspace }}/docker/certs:/etc/nginx/certs:ro" \
            blink-app:smoke-${{ matrix.arch }}
      - name: Wait for it to actually respond over HTTPS (${{ matrix.platform }})
        # /api/health hits the DB/Redis itself and reports "degraded" (503)
        # rather than erroring when a dependency is unreachable, exactly
        # the database's case here - 200 or 503 both prove nginx, uvicorn,
        # and the TLS cert are genuinely wired together and serving
        # requests; anything else (curl failing to connect at all, or a
        # timeout) means the container isn't actually running and healthy.
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w "%{http_code}" https://localhost:8443/api/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Got HTTP $code from /api/health - container is up and serving requests"
              exit 0
            fi
            sleep 2
          done
          echo "Container never answered https://localhost:8443/api/health within 60s"
          exit 1
      - name: Dump container logs on failure
        if: failure()
        run: docker logs smoke-${{ matrix.arch }}
      - name: Stop and remove the smoke containers
        if: always()
        run: |
          docker rm -f smoke-${{ matrix.arch }} smoke-redis-${{ matrix.arch }} >/dev/null 2>&1 || true
          docker network rm smoke-net-${{ matrix.arch }} >/dev/null 2>&1 || true

  prod-smoke:
    name: Docker · production stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate a self-signed TLS cert
        run: make certs
      - name: Write throwaway secrets for this ephemeral stack
        run: |
          cat >> "$GITHUB_ENV" <<EOF
          POSTGRES_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          REDIS_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          BLINK_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          BLINK_ENCRYPTION_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          EOF
      - name: Boot the production stack
        run: docker compose -f docker-compose.yml up -d --build --wait
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the smoke spec against the live production stack
        working-directory: e2e
        run: npm run smoke
      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: e2e/smoke-report
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  e2e-lint:
    name: E2E · eslint + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    name: E2E · Playwright against seeded stack
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Run e2e suite against an instrumented frontend, with coverage
        run: make e2e-coverage
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml --profile e2e logs postgres redis backend worker frontend
          echo "--- users table ---"
          docker compose -f docker-compose.test.yml --profile e2e exec -T postgres psql -U blink -d blink -c 'select id, email, display_name, created_at from users;'
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml --profile e2e down -v
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Upload e2e frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-coverage-report
          path: e2e/coverage
      - name: Upload e2e coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: e2e/coverage/cobertura-coverage.xml
          flags: e2e
          fail_ci_if_error: false

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [backend-test, frontend, e2e]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # disabling shallow clones improves relevancy of analysis
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        # Without node_modules, the TS sensor can't resolve frontend's
        # extended tsconfigs (@vue/tsconfig, @tsconfig/node24), which
        # otherwise shows up as an analysis warning.
        run: npm ci
        working-directory: frontend
      - name: Download backend coverage report
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend
      - name: Download frontend coverage report
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Download e2e coverage report
        # Same artifact the e2e job already uploads for manual debugging -
        # reused here for its lcov.info (see sonar-project.properties: a
        # real browser-flow lens on frontend/src that unit tests alone miss).
        uses: actions/download-artifact@v8
        with:
          name: e2e-coverage-report
          path: e2e/coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
