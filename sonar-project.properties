sonar.projectKey=blink-downloader_blink-downloader
sonar.organization=blink-downloader

sonar.projectName=Blink Downloader
sonar.projectVersion=1.2.0

sonar.sourceEncoding=UTF-8

# Production code vs. test code - kept disjoint so nothing double-counts.
# backend/alembic is included alongside app (env.py is hand-written; only
# its auto-generated versions/ subfolder is excluded below). e2e is all
# test-support code (specs, fixtures, smoke tests), so it's tests-only.
sonar.sources=backend/app,backend/alembic,frontend/src
sonar.tests=backend/tests,frontend/tests,e2e

# Generated/vendored/build output - never hand-written, nothing to analyze.
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**,\
  **/coverage/**,\
  **/coverage.xml,\
  **/.coverage,\
  **/htmlcov/**,\
  **/__pycache__/**,\
  **/*.tsbuildinfo,\
  frontend/src/api/schema.d.ts,\
  backend/alembic/versions/**,\
  backend/openapi.json,\
  e2e/playwright-report/**,\
  e2e/test-results/**,\
  e2e/smoke-report/**,\
  e2e/.nyc_output/**,\
  docker/certs/**

sonar.python.version=3.14

# Coverage reports - the sonarqube CI job downloads these as artifacts
# produced by the backend-test/frontend jobs (see ci.yml); it never runs the
# test suites itself.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
